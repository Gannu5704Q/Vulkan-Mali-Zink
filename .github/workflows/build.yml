name: Package Renderer APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Native Shared Library into APK
        run: |
          mkdir -p apk_root/lib/arm64-v8a
          cp app/src/main/jniLibs/arm64-v8a/libvulkan_mali_zink.so apk_root/lib/arm64-v8a/
          cp app/src/main/AndroidManifest.xml apk_root/
          
          cd apk_root
          zip -r ../Vulkan_Mali_Zink_Cloud.apk .
          cd ..
          
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 Vulkan_Mali_Zink_Cloud.apk Vulkan_Mali_Zink_Aligned.apk
          
          keytool -genkey -v -keystore release.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=VulkanMaliZink"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.jks --ks-pass pass:123456 --out Vulkan_Mali_Zink_Signed.apk Vulkan_Mali_Zink_Aligned.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan_Mali_Zink_APK
          path: Vulkan_Mali_Zink_Signed.apk
          
