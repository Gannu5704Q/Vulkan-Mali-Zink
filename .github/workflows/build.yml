name: Package Renderer APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Unaligned APK
        run: |
          mkdir -p build_apk/lib/arm64-v8a
          cp app/src/main/jniLibs/arm64-v8a/libvulkan_mali_zink.so build_apk/lib/arm64-v8a/
          cp app/src/main/AndroidManifest.xml build_apk/
          
          cd build_apk
          jar cf ../unsigned.apk .
          cd ..

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --min-sdk-version 24 --out Vulkan_Mali_Zink.apk unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan_Mali_Zink_APK
          path: Vulkan_Mali_Zink.apk
          
