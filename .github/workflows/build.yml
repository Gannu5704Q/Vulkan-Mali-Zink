name: Build Installable Renderer APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Resources, Manifest, and Build APK
        run: |
          # 1. Compile the resources folder (fixes the missing ic_launcher error)
          $ANDROID_HOME/build-tools/34.0.0/aapt2 compile --dir app/src/main/res -o compiled_res.zip

          # 2. Link resources and manifest into a proper base APK
          $ANDROID_HOME/build-tools/34.0.0/aapt2 link -o base.apk \
            --manifest app/src/main/AndroidManifest.xml \
            -R compiled_res.zip \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            --min-sdk-version 24 \
            --target-sdk-version 34

          # 3. Inject your native shared library into the compiled APK
          mkdir -p lib/arm64-v8a
          cp app/src/main/jniLibs/arm64-v8a/libvulkan_mali_zink.so lib/arm64-v8a/
          zip -ur base.apk lib/

          # 4. ZipAlign the APK for Android performance standards
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 base.apk aligned.apk

          # 5. Generate Key and Sign APK
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --min-sdk-version 24 --out Vulkan_Mali_Zink_Installable.apk aligned.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan_Mali_Zink_Installable_APK
          path: Vulkan_Mali_Zink_Installable.apk
          
